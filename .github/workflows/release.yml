name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (empty = dry run)
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      WINGET_TOKEN:
        required: false
  pull_request:
    paths:
      - 'build/**'
      - 'installer/**'
      - '.github/workflows/release.yml'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'global.json'
      - 'src/GapMouse.App/GapMouse.App.csproj'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ] && [ -z "$tag" ]; then
            echo "::error::Release invoked from a branch push without a tag input"
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ] || [ -z "$tag" ]; then
            echo "version=0.0.0-ci.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid SemVer version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            runner: windows-latest
          - arch: arm64
            rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        shell: pwsh
        run: ./build/Publish-App.ps1 -Runtime ${{ matrix.rid }} -Version ${{ needs.version.outputs.version }}
      - name: Portable zip
        shell: pwsh
        run: ./build/New-PortableZip.ps1 -PublishDir artifacts/publish/${{ matrix.arch }} -Version ${{ needs.version.outputs.version }} -Arch ${{ matrix.arch }}
      - name: Smoke test portable
        shell: pwsh
        run: ./build/Test-Portable.ps1 -ZipPath artifacts/dist/GapMouse-${{ needs.version.outputs.version }}-${{ matrix.arch }}-portable.zip
      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.arch }}
          path: artifacts/publish/${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.arch }}
          path: artifacts/dist/GapMouse-${{ needs.version.outputs.version }}-${{ matrix.arch }}-portable.zip

  installer:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      # Pinned to the version Chocolatey served when this job was written (Inno Setup 6.7.1).
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress --version 6.7.1
      - uses: actions/download-artifact@v8
        with:
          name: publish-x64
          path: artifacts/publish/x64
      - uses: actions/download-artifact@v8
        with:
          name: publish-arm64
          path: artifacts/publish/arm64
      - name: Build installers
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'arm64') {
            & ./build/New-Installer.ps1 -PublishDir "artifacts/publish/$arch" -Version ${{ needs.version.outputs.version }} -Arch $arch -OutputDir artifacts/installer
          }
      - uses: actions/upload-artifact@v7
        with:
          name: installer-x64
          path: artifacts/installer/GapMouse-Setup-${{ needs.version.outputs.version }}-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: installer-arm64
          path: artifacts/installer/GapMouse-Setup-${{ needs.version.outputs.version }}-arm64.exe

  installer-test:
    needs: [version, installer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: installer-${{ matrix.arch }}
          path: artifacts/installer
      - name: Smoke test installer
        shell: pwsh
        run: ./build/Test-Installer.ps1 -InstallerPath artifacts/installer/GapMouse-Setup-${{ needs.version.outputs.version }}-${{ matrix.arch }}.exe

  package:
    needs: [version, build, installer-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          path: artifacts/dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: artifacts/dist
          merge-multiple: true
      - name: Checksums
        shell: pwsh
        run: ./build/New-Checksums.ps1 -Directory artifacts/dist
      - name: Validate package
        shell: pwsh
        run: ./build/Test-Package.ps1 -Directory artifacts/dist -Version ${{ needs.version.outputs.version }} -Arch @('x64','arm64') -RequireInstaller
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: artifacts/dist

  publish:
    if: needs.version.outputs.dry_run == 'false'
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          pre=()
          if [[ "$VERSION" == *-* ]]; then pre=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            if [ "${#pre[@]}" -gt 0 ]; then gh release edit "$TAG" --prerelease; fi
          else
            gh release create "$TAG" dist/* --title "GapMouse $VERSION" --generate-notes --verify-tag "${pre[@]}"
          fi

  winget:
    # Stable releases only; pre-releases are never submitted to winget.
    if: needs.version.outputs.dry_run == 'false' && !contains(needs.version.outputs.version, '-')
    needs: [version, publish]
    runs-on: windows-latest
    steps:
      # Secrets cannot be used in step conditions, so gate on a step output instead.
      - id: gate
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINGET_TOKEN)) {
            Write-Host '::notice::WINGET_TOKEN not set; skipping winget update'
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Download wingetcreate
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        run: Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
      - name: Submit manifest update
        if: steps.gate.outputs.enabled == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $base = "https://github.com/Gustavo-Piccoli/GapMouse/releases/download/$env:TAG"
          $x64 = "$base/GapMouse-Setup-$env:VERSION-x64.exe|x64"
          $arm64 = "$base/GapMouse-Setup-$env:VERSION-arm64.exe|arm64"
          ./wingetcreate.exe update GustavoPiccoli.GapMouse --version $env:VERSION --urls $x64 $arm64 --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed with exit code $LASTEXITCODE" }
