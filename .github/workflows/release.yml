name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (empty = dry run)
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      WINGET_TOKEN:
        required: false
  pull_request:
    paths:
      - 'build/**'
      - 'installer/**'
      - '.github/workflows/release.yml'
      - 'Directory.Packages.props'
      - 'src/GapMouse.App/GapMouse.App.csproj'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - id: v
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [ "$EVENT" = "pull_request" ] || [ -z "$tag" ]; then
            echo "version=0.0.0-ci.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid SemVer version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            runner: windows-latest
          - arch: arm64
            rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        shell: pwsh
        run: ./build/Publish-App.ps1 -Runtime ${{ matrix.rid }} -Version ${{ needs.version.outputs.version }}
      - name: Portable zip
        shell: pwsh
        run: ./build/New-PortableZip.ps1 -PublishDir artifacts/publish/${{ matrix.arch }} -Version ${{ needs.version.outputs.version }} -Arch ${{ matrix.arch }}
      - name: Smoke test portable
        shell: pwsh
        run: ./build/Test-Portable.ps1 -ZipPath artifacts/dist/GapMouse-${{ needs.version.outputs.version }}-${{ matrix.arch }}-portable.zip
      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.arch }}
          path: artifacts/publish/${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.arch }}
          path: artifacts/dist/GapMouse-${{ needs.version.outputs.version }}-${{ matrix.arch }}-portable.zip

  package:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          path: artifacts/dist
          merge-multiple: true
      - name: Checksums
        shell: pwsh
        run: ./build/New-Checksums.ps1 -Directory artifacts/dist
      - name: Validate package
        shell: pwsh
        run: ./build/Test-Package.ps1 -Directory artifacts/dist -Version ${{ needs.version.outputs.version }} -Arch @('x64','arm64')
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: artifacts/dist

  publish:
    if: needs.version.outputs.dry_run == 'false'
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "GapMouse $VERSION" --generate-notes --verify-tag
          fi
