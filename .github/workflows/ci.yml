name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      # Tests run on Microsoft.Testing.Platform (opted in via global.json), so the
      # VSTest-style --filter / --collect flags are replaced by their MTP equivalents.
      - run: dotnet test -c Release --no-build --filter-not-trait "Category=Win32" --coverage --coverage-output-format cobertura --results-directory TestResults
      - run: dotnet reportgenerator -reports:"TestResults/**/*.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Cobertura"
      - name: Publish coverage summary
        shell: pwsh
        run: Get-Content coverage/SummaryGithub.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

  aot-publish:
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet publish tools/GapMouse.DevConsole -c Release -r win-x64 -o artifacts/devconsole
      - uses: actions/upload-artifact@v7
        with:
          name: devconsole-win-x64
          path: artifacts/devconsole
          retention-days: 7
